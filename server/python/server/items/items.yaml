  router:
    class: RouterBaseItem
    name: "Tube Router"
    description: "When more than 2 tubes are connected to it, routes traffic between them according to rule"
    documentation: |
      Can be configured to either work in SPLITTER MODE, or in ROUTER MODE. Additionally, it can be configured
      to route/split traffic in a specific direction (up, down, left, right)
      
      #### ROUTER mode
      In router mode, all incoming items are redirected as the arrow points.
      
      tile_image(traffic comes from left or right then redirected to top, 5, 4, 0, 0, 97, 0, 0, 0, 0, 97, 0, 0, 93, 96, 100, 96, 94, 97, 0, 0, 0, 97)
      
      #### SPLITTER mode
      In splitter mode, all item coming from the direction as the arrow points, are evenly distributed into other
      tubes, in a round-robin pattern.
      
      tile_image(traffic comes from the left and redirected top or left, 5, 4, 0, 0, 97, 0, 0, 0, 0, 97, 0, 0, 93, 96, 113, 96, 106, 97, 0, 0, 0, 97)
      
      #### Computer control
      When in ROUTER mode, it can be controlled by a computer [computer](#user-content-computer) nearby.
      To do that, the player choses Advanced -> Control By Computer
      
      When computer is selected, and an item passes the router, instead of passing the item along,
      the router sends the following message to the computer:
      
      ```bash
      route
      <type>
      <amount>
      <router hostname>
      ```
      
      Computer in turn can reply that message, and command to the router to direct loaded item in a certain direction.

      Example of BASIC program that prints info on items that pass by,
      and controls the router to route all of them "down".
      
      ```basic
      10 PRINT "listening"
      20 %listen #4,1
      30 %accept #5,4
      40 INPUT #5;a$
      50 PRINT "action=";a$
      60 INPUT #5;t$
      70 PRINT " item=";t$
      80 INPUT #5;am
      90 PRINT " amount=";am
      100 INPUT #5;h$
      110 PRINT " from=";h$
      120 PRINT #5;"down"
      130 %close #5
      140 GO TO 30
      ```

    actions:
      - title: "Get Loaded Items"
        device: router1
        requests:
          - item
        responses:
          - var: item
            type: str
            description: "Type of items"
            example: "ore_iron"
          - var: amount
            type: int
            description: "Amount of items"
            example: "1"
        description: |
          Gets information about the amount and type of the loaded item. If nothing is loaded, returns "0" and ""
      - title: "Push Loaded Item"
        device: router1
        requests:
          - push
          - up
        description: |
          Changes the direction of the router into one of following directions: "right", "left", "up", "down", 
          all items now go in that direction.
    icon: !!python/name:server.blocks.ROUTER_UP
    crafting_time: 5
    place_checks:
      deny: true
    power_consumption: 20
    width: 1
    height: 1
    blocks:
      "0x0": router_spawner(blocks.ROUTER_UP, "transport")

  router_s:
    class: BaseSpawnerItem
    base: router
    name: "Tube Router"
    description: "When more than 2 tubes are connected to it, routes traffic between them according to rule"
    icon: !!python/name:server.blocks.ROUTER_UP
    store:
      amount: 1
      value: 19
    unlock:
      contract: "delivery-3"

  door:
    class: DoorBaseItem
    tag: door
    name: "Steel Door"
    place_checks:
      deny: true
    description: |
      Steel door that can be opened and closed. Opens when power is lost.
    documentation: |
      Steel door that can be opened and closed. Opens when power is lost.
      
      #### Opened door
      tile_image(Opened door, 1, 4, 196, 0, 0, 194)
      
      #### Closed door
      tile_image(Closed door, 1, 4, 196, 195, 195, 194)

    actions:
      - title: "Open Door"
        device: door1
        requests:
          - open
        description: |
          Opens the door
      - title: "Close Door"
        device: door1
        requests:
          - close
        description: |
          Closes the door
    power_consumption: 1
    icon: !!python/name:server.blocks.DOOR
    crafting_time: 5
    width: 1
    height: 4
    blocks:
      "0x0": blocks.DOOR_TOP
      "0x1": blocks.DOOR_FIELD
      "0x2": blocks.DOOR_FIELD
      "0x3": blocks.DOOR_BOTTOM

  door_s:
    class: BaseSpawnerItem
    base: door
    name: "Steel Door"
    description: "Steel door that opened and closed (including programmatically)"
    icon: !!python/name:server.blocks.DOOR
    store:
      amount: 1
      value: 19
    unlock:
      contract: "fresh-air"

  rocket:
    class: ProjectileItem
    projectile: rock
    name: "Rocket"
    stack_limit: 8
    damage_value: 60
    place_checks:
      deny: true
    power: 5
    description: "A projectile that can deal damage"
    icon: !!python/name:server.blocks.ROCKET
    store:
      amount: 10
      value: 9
    unlock:
      contract: "delivery-4"

  collector:
    class: CollectorBoxItem
    name: "Container Collector"
    description: "Can collect items from a tube"
    documentation: |
      Has its own inventory (accessed by pressing I nearby), if an inlet tube is connected to it, all items are collected.
      If an outlet tube is connected, can be commanded by a [Computer](#user-content-computer) to pull an item into the tube.

    icon: !!python/name:server.blocks.COLLECTOR_BOX_ICON
    width: 3
    height: 1
    place_checks:
      deny: true
    actions:
      - title: "Count Items"
        device: collector1
        requests:
          - amount
          - wood
        responses:
          - var: amount
            type: int
            description: "Amount of <wood>"
            example: "1"
        description: |
          Count amount of items available of certain item ("wood") and returns its number.
          If empty string ("") is specified, overall item count is returned.
      - title: "Pull Items Into Tube"
        device: collector1
        requests:
          - pull
          - wood
        description: |
          Pulls item of type ("wood") and pulls it into an outlet tube. If empty string ("") is specified,
          any available item is pulled.
    blocks:
      "0x0": tube_outlet_spawner(blocks.COLLECTOR_BOX[0], "transport", "up")
      "1x0": blocks.COLLECTOR_BOX[1]
      "2x0": tube_inlet_spawner(blocks.COLLECTOR_BOX[2], "transport", "up")

  collector_s:
    class: BaseSpawnerItem
    base: collector
    name: "Container Collector"
    description: "Can collect items from a tube"
    icon: !!python/name:server.blocks.COLLECTOR_BOX_ICON
    store:
      amount: 1
      value: 19
    unlock:
      contract: "delivery-3"

  fob:
    class: FOBBaseItem
    name: "FOB"
    place_checks:
      deny: true
    description: |
      Forward Operation Base. When placed, allows you to receive and send shipments, craft things.
      
      #### Ship Deck
      
      FOB can host ships. When a ship has landed onto a FOB, players can interact with ship's deck to take or put items.
      If player puts any items into ships deck, after the ship goes back, items get sold (and player is compensated).
      Note that after ship has landed, it goes back automatically in some time, so make sure to take the items you need off ship's deck.
      To order ships, use StarStore menu.
      
      #### StarStore
      
      FOB allows the player to purchase items from StarStore.
      
      #### Crafting
      
      FOB allows players to craft items manually when needed. To craft items automatically, use [Factory](#user-content-factory)
    icon: !!python/name:server.blocks.FOB_SPAWNER
    width: 3
    height: 2
    blocks:
      "0x0": blocks.FOB[0]
      "1x0": blocks.FOB[1]
      "2x0": blocks.FOB[2]
      "0x1": blocks.FOB[3]
      "1x1": blocks.FOB[4]
      "2x1": blocks.FOB[5]

  fob_s:
    class: BaseSpawnerItem
    base: fob
    name: "FOB"
    description: "Forward Operation Base\nWhen placed, allows you to receive and send shipments"
    icon: !!python/name:server.blocks.FOB_SPAWNER

  chest:
    class: InventoryBoxItem
    name: "Chest"
    description: "Chest with goods"
    place_checks:
      deny: true
    documentation: |
      Basic structure you can place items in (it has its own inventory).
    icon: !!python/name:server.blocks.CRATE

  computer:
    class: ComputerBaseItem
    name: "Computer"
    description: "ZX Spectrum Computer"
    place_checks:
      deny: true
    documentation: |
      When powered on, emulates full zx spectrum computer.
      When the player opens computer menu, the internal computer screen goes full screen as if the player now
      controls that computer. It can run any code, written in BASIC, C, Asm or anything else, as it emulates
      z80 processor with 16k of ROM, 48k of RAM and a [Spectranet](https://spectrum.alioth.net/doc/index.php/Main_Page)
      cartridge.
      
      Can run any code, but is the mose useful at [Network Communication](#user-content-network-communication).
    icon: !!python/name:server.blocks.COMPUTER_ICON
    width: 2
    height: 2
    power_consumption: 20
    blocks:
      "0x0": blocks.COMPUTER[0]
      "1x0": blocks.COMPUTER[1]
      "0x1": blocks.COMPUTER[2]
      "1x1": blocks.COMPUTER[3]

  computer_s:
    class: BaseSpawnerItem
    base: computer
    name: "Computer"
    description: "Executes BASIC Programs"
    icon: !!python/name:server.blocks.COMPUTER_ICON
    store:
      amount: 1
      value: 49
    unlock:
      contract: "delivery-3"

  spidernest:
