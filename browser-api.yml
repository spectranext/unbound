version: '3'
services:
  redis:
    image: redis:latest
    container_name: unbound_browser_redis
    restart: always
  server_browser_api:
    build:
      context: .
      dockerfile: Dockerfile.server-browser-api
    environment:
      REDIS_HOST: "redis"
    volumes:
      - statuses:/runtime/statuses
    container_name: unbound_browser_api
    restart: always
    ports:
      - 5000:5000
  server_browser:
    build:
      context: .
      dockerfile: Dockerfile.server-browser
    container_name: unbound_browser_tnfs
    restart: always
    volumes:
      - statuses:/statuses
    ports:
      - 16384:16384/udp
    depends_on:
      - server_browser_api

volumes:
  statuses: